<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Stack</title>
    <style>
        :root {
            --bg-color: #120e1b;
            --text-color: #e0d8f0;
            --card-bg: #201a30;
            --border-color: #7b5cff;
            --dark-border: #ffffff;
            --title-color: #ffffff;
            --btn-bg: linear-gradient(135deg, #7b5cff, #ff7675);
            --btn-text: #ffffff;
            --arcade-btn-bg: rgba(32, 26, 48, 0.94);
            --arcade-btn-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(18, 14, 27, 0.9);
            backdrop-filter: blur(8px);
            z-index: 20;
            padding: 16px;
            overflow-y: auto;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .sketch-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(123, 92, 255, 0.3);
            padding: 28px 24px;
            max-width: 380px;
            width: 95%;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: var(--title-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .start-graphic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            cursor: pointer;
        }

        #start-graphic-canvas {
            width: 260px;
            height: 140px;
            background: transparent;
            touch-action: manipulation;
            cursor: pointer;
        }

        .tap-hint {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffd700;
            margin-top: 8px;
            animation: pulse 1.4s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .android-footer {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 25;
        }

        .for-android-text {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #a090c0;
            margin-bottom: 4px;
            text-transform: lowercase;
        }

        .android-head-svg {
            width: 72px;
            height: 40px;
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .sketch-button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            outline: none;
            box-shadow: 0 6px 20px rgba(123, 92, 255, 0.4);
            touch-action: manipulation;
            transition: transform 0.1s ease;
        }

        .sketch-button:active {
            transform: scale(0.96);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 24px;
            z-index: 5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .score-board {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        .best-score-badge {
            background: var(--arcade-btn-bg);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }

        .instructions {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: pulse 1.5s infinite alternate;
            pointer-events: none;
        }

        /* Game Over Modal */
        #game-over h1 {
            color: #ff5252;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.4);
        }

        #game-over p {
            color: #ffffff;
            font-size: 1.2rem;
            margin: 8px 0;
            font-weight: 600;
        }

        #best-score-over {
            color: #ffd700 !important;
            font-size: 1.3rem;
            margin-bottom: 24px !important;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Tower Stack Welcome Screen -->
    <div id="start-overlay" class="overlay">
        <div class="sketch-card">
            <h1>TOWER STACK</h1>
            <div class="start-graphic-container" id="start-graphic-trigger">
                <canvas id="start-graphic-canvas" width="260" height="140"></canvas>
                <div class="tap-hint">[ tap / space / enter ]</div>
            </div>
        </div>

        <div class="android-footer">
            <div class="for-android-text">for android</div>
            <svg class="android-head-svg" viewBox="0 0 100 55" xmlns="http://www.w3.org/2000/svg">
                <line id="droid-ant-1" x1="32" y1="20" x2="18" y2="5" stroke="#7b5cff" stroke-width="3" stroke-linecap="round"/>
                <line id="droid-ant-2" x1="68" y1="20" x2="82" y2="5" stroke="#7b5cff" stroke-width="3" stroke-linecap="round"/>
                <path id="droid-head" d="M 10 55 A 40 40 0 0 1 90 55 Z" fill="#201a30" stroke="#7b5cff" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="34" cy="36" r="3.5" fill="#ffffff"/>
                <circle cx="66" cy="36" r="3.5" fill="#ffffff"/>
            </svg>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui">
        <div class="header">
            <div class="score-board" id="score">0</div>
            <div class="best-score-badge">current record: <span id="hi-score-hud">0</span></div>
        </div>
        <div class="instructions" id="hint">&lt;3</div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="overlay hidden">
        <div class="sketch-card">
            <h1>STACK OVER</h1>
            <p id="final-score">Score: 0</p>
            <p id="best-score-over">Highest Stack: 0</p>
            <button class="sketch-button" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="three.min.js"></script>

    <script>
        // --- COLOR-CHANGING LOGO & WELCOME ANIMATION ---
        const startCanvas = document.getElementById('start-graphic-canvas');
        const startCtx = startCanvas.getContext('2d');
        const startGraphicTrigger = document.getElementById('start-graphic-trigger');
        const droidHead = document.getElementById('droid-head');
        const droidAnt1 = document.getElementById('droid-ant-1');
        const droidAnt2 = document.getElementById('droid-ant-2');

        let startFrame = 0;
        let blockPressed = false;
        let logoHue = 0;

        function renderStartGraphic() {
            startFrame++;
            logoHue = (logoHue + 0.8) % 360;
            const currentNeonColor = `hsl(${logoHue}, 80%, 65%)`;

            // Update Android Head Logo lines to match game block colors dynamically
            droidHead.style.stroke = currentNeonColor;
            droidAnt1.style.stroke = currentNeonColor;
            droidAnt2.style.stroke = currentNeonColor;

            startCtx.clearRect(0, 0, startCanvas.width, startCanvas.height);
            
            startCtx.lineWidth = 3;
            startCtx.lineCap = 'round';
            startCtx.lineJoin = 'round';

            startCtx.save();
            startCtx.translate(130, 75);
            if (blockPressed) startCtx.translate(0, 4);

            // Stacked base blocks with colorful theme borders
            startCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            startCtx.fillStyle = '#2d2442';
            startCtx.fillRect(-45, 15, 90, 22);
            startCtx.strokeRect(-45, 15, 90, 22);

            startCtx.fillStyle = '#382c54';
            startCtx.fillRect(-45, -5, 90, 22);
            startCtx.strokeRect(-45, -5, 90, 22);

            // Sliding top block matching active neon hue
            let offset = Math.sin(startFrame * 0.06) * 40;
            startCtx.fillStyle = currentNeonColor;
            startCtx.strokeStyle = '#ffffff';
            startCtx.fillRect(-40 + offset, -27, 80, 24);
            startCtx.strokeRect(-40 + offset, -27, 80, 24);

            startCtx.fillStyle = '#120e1b';
            startCtx.font = 'bold 11px sans-serif';
            startCtx.textAlign = 'center';
            startCtx.textBaseline = 'middle';
            startCtx.fillText('DROP', offset, -15);

            startCtx.restore();

            if (!gameStarted) {
                requestAnimationFrame(renderStartGraphic);
            }
        }

        // --- GAME CONFIG & CONSTANTS ---
        const BLOCK_SIZE = 3.5;
        const BLOCK_HEIGHT = 0.5;
        const INITIAL_SPEED = 0.05;
        const STORAGE_KEY = 'tower_stack_highest_score';
        
        let scene, camera, renderer;
        let stack = [];
        let debris = [];
        let currentBlock = null;
        let direction = 'x'; 
        let speed = INITIAL_SPEED;
        let score = 0;
        let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
        let gameOver = false;
        let gameStarted = false;
        let colorHue = Math.random();
        let audioCtx = null;

        let currentCameraY = 4;

        // --- DOM ELEMENTS ---
        const scoreEl = document.getElementById('score');
        const hiScoreHudEl = document.getElementById('hi-score-hud');
        const hintEl = document.getElementById('hint');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreOverEl = document.getElementById('best-score-over');
        const restartBtn = document.getElementById('restart-btn');
        const startOverlay = document.getElementById('start-overlay');

        hiScoreHudEl.innerText = highScore;

        // --- AUDIO SYNTHESIS ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPlacementSound(comboScore) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const baseFreq = 220;
            const freq = baseFreq + Math.min(comboScore * 15, 600);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.15);

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playGameOverSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);

            gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function startGame() {
            playClickSound();
            blockPressed = true;
            setTimeout(() => {
                startOverlay.classList.add('hidden');
                gameStarted = true;
                blockPressed = false;
                resetGame();
            }, 120);
        }

        // --- INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x120e1b, 0.025);

            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 12;
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2,
                frustumSize * aspect / 2,
                frustumSize / 2,
                frustumSize / -2,
                0.1,
                1000
            );
            
            currentCameraY = 4;
            updateCameraPosition(0, true);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', handleInput);

            // Handle keyboard inputs (Spacebar & Enter)
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    if (!gameStarted) {
                        startGame();
                    } else if (gameOver) {
                        playClickSound();
                        resetGame();
                    } else {
                        handleInput(e);
                    }
                }
            });
            
            restartBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playClickSound();
                resetGame();
            });

            startGraphicTrigger.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                startGame();
            });

            renderStartGraphic();
            animate();
        }

        // --- GAME LOGIC ---
        function resetGame() {
            stack.forEach(block => scene.remove(block.mesh));
            debris.forEach(d => scene.remove(d.mesh));
            if (currentBlock) scene.remove(currentBlock.mesh);

            stack = [];
            debris = [];
            score = 0;
            speed = INITIAL_SPEED;
            gameOver = false;
            direction = 'x';
            colorHue = Math.random();

            scoreEl.innerText = score;
            hiScoreHudEl.innerText = highScore;
            gameOverEl.classList.add('hidden');
            hintEl.style.display = 'block';

            const baseGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_HEIGHT, BLOCK_SIZE);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: getNextColor(),
                roughness: 0.3,
                metalness: 0.1
            });
            const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
            baseMesh.position.set(0, 0, 0);
            baseMesh.receiveShadow = true;
            scene.add(baseMesh);

            stack.push({
                mesh: baseMesh,
                x: 0,
                z: 0,
                width: BLOCK_SIZE,
                depth: BLOCK_SIZE
            });

            currentCameraY = 4;
            updateCameraPosition(0, true);
            spawnBlock();
        }

        function getNextColor() {
            colorHue = (colorHue + 0.04) % 1;
            return new THREE.Color().setHSL(colorHue, 0.7, 0.6);
        }

        function spawnBlock() {
            if (!gameStarted) return;
            const previousBlock = stack[stack.length - 1];
            const geometry = new THREE.BoxGeometry(previousBlock.width, BLOCK_HEIGHT, previousBlock.depth);
            const material = new THREE.MeshStandardMaterial({
                color: getNextColor(),
                roughness: 0.3,
                metalness: 0.1
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const spawnDistance = 6;
            let x = previousBlock.x;
            let z = previousBlock.z;

            if (direction === 'x') {
                x = -spawnDistance;
            } else {
                z = -spawnDistance;
            }

            const targetY = previousBlock.mesh.position.y + BLOCK_HEIGHT;
            mesh.position.set(x, targetY, z);
            scene.add(mesh);

            currentBlock = {
                mesh: mesh,
                x: x,
                z: z,
                width: previousBlock.width,
                depth: previousBlock.depth
            };
        }

        function handleInput(e) {
            if (!gameStarted || (e.target && e.target.tagName === 'BUTTON') || gameOver || !currentBlock) return;

            hintEl.style.display = 'none';
            placeBlock();
        }

        function placeBlock() {
            const previousBlock = stack[stack.length - 1];
            let overlap, delta;

            if (direction === 'x') {
                delta = currentBlock.x - previousBlock.x;
                overlap = previousBlock.width - Math.abs(delta);
            } else {
                delta = currentBlock.z - previousBlock.z;
                overlap = previousBlock.depth - Math.abs(delta);
            }

            if (overlap <= 0) {
                currentBlock.velocity = { x: direction === 'x' ? speed * 50 : 0, y: -0.1, z: direction === 'z' ? speed * 50 : 0 };
                debris.push(currentBlock);
                currentBlock = null;
                endGame();
                return;
            }

            playPlacementSound(score);

            let newWidth = direction === 'x' ? overlap : currentBlock.width;
            let newDepth = direction === 'z' ? overlap : currentBlock.depth;

            if (Math.abs(delta) < 0.12) {
                delta = 0;
                overlap = direction === 'x' ? previousBlock.width : previousBlock.depth;
                newWidth = previousBlock.width;
                newDepth = previousBlock.depth;
            }

            let newX = previousBlock.x;
            let newZ = previousBlock.z;

            if (direction === 'x') {
                newX = previousBlock.x + delta / 2;
                currentBlock.mesh.scale.x = overlap / currentBlock.width;
                currentBlock.mesh.position.x = newX;
            } else {
                newZ = previousBlock.z + delta / 2;
                currentBlock.mesh.scale.z = overlap / currentBlock.depth;
                currentBlock.mesh.position.z = newZ;
            }

            const debrisWidth = direction === 'x' ? Math.abs(delta) : currentBlock.width;
            const debrisDepth = direction === 'z' ? Math.abs(delta) : currentBlock.depth;
            
            if (Math.abs(delta) >= 0.12) {
                const debrisGeometry = new THREE.BoxGeometry(debrisWidth, BLOCK_HEIGHT, debrisDepth);
                const debrisMesh = new THREE.Mesh(debrisGeometry, currentBlock.mesh.material);
                debrisMesh.castShadow = true;
                
                let debrisX = direction === 'x' ? newX + (overlap / 2 + debrisWidth / 2) * Math.sign(delta) : currentBlock.x;
                let debrisZ = direction === 'z' ? newZ + (overlap / 2 + debrisDepth / 2) * Math.sign(delta) : currentBlock.z;
                
                debrisMesh.position.set(debrisX, currentBlock.mesh.position.y, debrisZ);
                scene.add(debrisMesh);

                debris.push({
                    mesh: debrisMesh,
                    velocity: { x: direction === 'x' ? speed * 50 * Math.sign(delta) : 0, y: -0.05, z: direction === 'z' ? speed * 50 * Math.sign(delta) : 0 }
                });
            }

            stack.push({
                mesh: currentBlock.mesh,
                x: newX,
                z: newZ,
                width: newWidth,
                depth: newDepth
            });

            currentBlock = null;

            score++;
            scoreEl.innerText = score;
            speed += 0.0015;

            direction = direction === 'x' ? 'z' : 'x';
            spawnBlock();
        }

        function updateCameraPosition(stackHeight, immediate = false) {
            const topBlockY = stack.length > 0 ? stack[stack.length - 1].mesh.position.y : 0;
            const targetHeight = topBlockY + 4;
            
            if (immediate) {
                currentCameraY = targetHeight;
            } else {
                currentCameraY += (targetHeight - currentCameraY) * 0.1;
            }

            const angleOffset = 8;
            camera.position.set(angleOffset, currentCameraY, angleOffset);
            camera.lookAt(0, currentCameraY - 3, 0);
        }

        function endGame() {
            gameOver = true;
            playGameOverSound();
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem(STORAGE_KEY, highScore);
            }

            hiScoreHudEl.innerText = highScore;
            finalScoreEl.innerText = `Score: ${score}`;
            bestScoreOverEl.innerText = `Highest Stack: ${highScore}`;
            gameOverEl.classList.remove('hidden');
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                updateCameraPosition();

                if (!gameOver && currentBlock) {
                    const time = Date.now() * 0.003 * (speed * 25);
                    const range = 3.5;
                    
                    if (direction === 'x') {
                        currentBlock.x = Math.sin(time) * range;
                        currentBlock.mesh.position.x = currentBlock.x;
                    } else {
                        currentBlock.z = Math.sin(time) * range;
                        currentBlock.mesh.position.z = currentBlock.z;
                    }
                }

                for (let i = debris.length - 1; i >= 0; i--) {
                    const d = debris[i];
                    d.mesh.position.y += d.velocity.y;
                    d.velocity.y -= 0.01; 
                    d.mesh.rotation.x += 0.02;
                    d.mesh.rotation.z += 0.02;

                    if (d.mesh.position.y < -10) {
                        scene.remove(d.mesh);
                        debris.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 12;
            camera.left = frustumSize * aspect / -2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
